<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 화장장 관할 구역 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f5f5f5; }

  #header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    background:#fff; padding:10px 20px;
    border-bottom:1px solid #ddd;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  #header h1 { font-size:15px; font-weight:700; color:#1a1a1a; }
  #header p { font-size:11px; color:#999; margin-top:2px; }

  #map { position:fixed; top:52px; left:0; right:290px; bottom:0; background:#fff; }

  #sidebar {
    position:fixed; top:52px; right:0; width:290px; bottom:0;
    background:#fafafa; overflow-y:auto;
    border-left:1px solid #e0e0e0; padding:12px;
  }
  #sidebar h2 {
    font-size:10px; font-weight:700; color:#aaa;
    letter-spacing:1.5px; text-transform:uppercase;
    margin-bottom:10px; padding-bottom:6px;
    border-bottom:1px solid #eee;
  }

  /* 도 단위 섹션 */
  .sido-section { margin-bottom:10px; }
  .sido-header {
    font-size:11px; font-weight:700; color:#444;
    padding:5px 6px; background:#f0f0f0; border-radius:5px;
    margin-bottom:4px; letter-spacing:-0.2px;
  }
  .legend-item {
    display:flex; align-items:flex-start; gap:8px;
    padding:6px 8px; border-radius:6px; margin-bottom:3px;
    background:#fff; border:1px solid #eee;
  }
  .legend-color { width:10px; height:10px; border-radius:2px; flex-shrink:0; margin-top:2px; }
  .legend-label { font-size:11px; color:#333; line-height:1.4; }
  .legend-label .jur { font-size:10px; color:#999; display:block; margin-top:1px; }
  .legend-cost { font-size:10px; margin-top:2px; }
  .cost-in { color:#2E7D32; font-weight:700; }
  .cost-out { color:#C62828; font-weight:700; }
  .cost-ratio { color:#E65100; font-size:9px; font-weight:700; margin-left:2px; }

  /* 팝업 */
  .leaflet-popup-content-wrapper {
    background:#fff; border:1px solid #ddd; border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.12);
  }
  .leaflet-popup-tip { background:#fff; }
  .leaflet-popup-content { margin:14px 16px; min-width:210px; }
  .popup-name { font-size:14px; font-weight:700; color:#111; margin-bottom:4px; }
  .popup-addr { font-size:11px; color:#777; margin-bottom:8px; line-height:1.5; }
  .popup-cost {
    background:#f8f8f8; border-radius:8px; padding:10px 12px;
    margin-bottom:8px; border:1px solid #eee;
  }
  .popup-cost-title { font-size:10px; font-weight:700; color:#555; margin-bottom:7px; }
  .popup-cost-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .popup-cost-label { font-size:11px; color:#888; }
  .popup-cost-val { font-size:14px; font-weight:700; letter-spacing:-0.03em; }
  .popup-cost-val.in { color:#2E7D32; }
  .popup-cost-val.out { color:#C62828; }
  .popup-cost-divider { height:1px; background:#eee; margin:5px 0; }
  .popup-cost-ratio { font-size:11px; font-weight:700; color:#E65100; text-align:right; margin-top:2px; }
  .popup-note { font-size:10px; color:#aaa; margin-top:4px; font-style:italic; }
  .popup-jur { font-size:10px; color:#555; line-height:1.6; margin-top:4px; }

  /* 툴팁 — 가로 레이아웃 */
  .leaflet-tooltip {
    background:rgba(20,20,20,0.92); border:none; color:#fff;
    font-size:11px; border-radius:6px; padding:6px 11px;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    pointer-events:none; white-space:nowrap;
  }
  .leaflet-tooltip-left::before { border-left-color:rgba(20,20,20,0.92); }
  .leaflet-tooltip-right::before { border-right-color:rgba(20,20,20,0.92); }
  .tt-wrap { display:flex; align-items:center; gap:8px; }
  .tt-name { font-weight:700; font-size:12px; }
  .tt-sep { color:rgba(255,255,255,0.3); }
  .tt-label { color:rgba(255,255,255,0.75); font-size:11px; }
  .tt-none { color:#FF8A80; font-size:11px; }
</style>
</head>

    const key2 = feat.properties.NAME_1+'|'+feat.properties.NAME_2;
    const ckey = JURISDICTION[key2]||'none';
    return { fillColor:COLORS[ckey]||'#fff', fillOpacity:ckey==='none'?0.06:0.50, color:'#bbb', weight:0.7 };
  },
  onEachFeature: (feat, layer) => {
    const key2  = feat.properties.NAME_1+'|'+feat.properties.NAME_2;
    const ckey  = JURISDICTION[key2]||'none';
    const krName= KR_MAP[feat.properties.NAME_2]||feat.properties.NAME_2;
    const label = LABELS[ckey]||'관내 화장장 없음';

    // 툴팁: 가로 레이아웃, 비용 없음
    const tipContent = ckey === 'none'
      ? `<div class="tt-wrap"><span class="tt-name">${krName}</span><span class="tt-sep">|</span><span class="tt-none">관내 화장장 없음</span></div>`
      : `<div class="tt-wrap"><span class="tt-name">${krName}</span><span class="tt-sep">|</span><span class="tt-label">${label}</span></div>`;

    layer.bindTooltip(tipContent, { sticky:true, offset:[10,0] });
    layer.on('mouseover', function() { this.setStyle({ fillOpacity:ckey==='none'?0.12:0.72, weight:1.5, color:'#888' }); });
    layer.on('mouseout',  function() { this.setStyle({ fillOpacity:ckey==='none'?0.06:0.50, weight:0.7,  color:'#bbb' }); });
  }
}).addTo(map);



// ── 마커 ──
CREMATORIA.forEach(c => {
  const icon = L.divIcon({
    className:'',
    html:`<div style="width:14px;height:14px;border-radius:50%;background:${c.color};border:2.5px solid #fff;box-shadow:0 0 0 2px ${c.color}66,0 2px 6px rgba(0,0,0,0.3);"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
  const r = ratio(c.cost_in, c.cost_out);
  const noteHtml = c.note ? `<div class="popup-note">※ ${c.note}</div>` : '';
  const costBlock = (c.cost_in !== null && c.cost_in !== undefined)
    ? `<div class="popup-cost">
        <div class="popup-cost-title">💰 일반 성인 화장 요금</div>
        <div class="popup-cost-row">
          <span class="popup-cost-label">관내 주민</span>
          <span class="popup-cost-val in">${fmtWon(c.cost_in)}</span>
        </div>
        <div class="popup-cost-row">
          <span class="popup-cost-label">관외 주민</span>
          <span class="popup-cost-val out">${fmtWon(c.cost_out)}</span>
        </div>
        ${r?`<div class="popup-cost-divider"></div><div class="popup-cost-ratio">관외가 관내보다 ${r}배 비쌉니다</div>`:''}
        ${noteHtml}
      </div>`
    : `<div class="popup-cost"><div class="popup-cost-title" style="color:#aaa;">💰 ${c.note||'요금 정보 없음'}</div></div>`;

  L.marker([c.lat,c.lng],{icon}).addTo(map)
    .bindPopup(`
      <div class="popup-name">${c.name}</div>
      <div class="popup-addr">📍 ${c.addr}</div>
      ${costBlock}
      <div class="popup-jur">관할: ${c.jur}</div>
    `,{maxWidth:260})
    .bindTooltip(c.name, {direction:'top', offset:[0,-10]});
});

// ── 범례: 도 단위 그룹 ──
const legendList = document.getElementById('legend-list');
const grouped = {};
CREMATORIA.forEach(c => {
  const s = c.sido;
  if (!grouped[s]) grouped[s] = [];
  // 같은 이름 중복 제거
  if (!grouped[s].find(x => x.name === c.name)) grouped[s].push(c);
});

SIDO_ORDER.forEach(sido => {
  if (!grouped[sido]) return;
  const krSido = SIDO_KR[sido] || sido;
  const cnt = grouped[sido].length;
  let html = `<div class="sido-section"><div class="sido-header">${krSido} <span style="font-weight:400;color:#888;font-size:10px;">(${cnt}곳)</span></div>`;
  grouped[sido].forEach(c => {
    const r = ratio(c.cost_in, c.cost_out);
    html += `
      <div class="legend-item">
        <div class="legend-color" style="background:${c.color}"></div>
        <div class="legend-label">
          ${c.name}
          <span class="jur">${c.jur}</span>
          <div class="legend-cost">
            <span class="cost-in">${fmtWon(c.cost_in)}</span> →
            <span class="cost-out">${fmtWon(c.cost_out)}</span>
            ${r?`<span class="cost-ratio">${r}배</span>`:''}
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  legendList.innerHTML += html;
});

legendList.innerHTML += `
  <div style="height:1px;background:#eee;margin:8px 0;"></div>
  <div class="legend-item">
    <div class="legend-color" style="background:#fff;border:1px solid #ddd;"></div>
    <div class="legend-label" style="color:#aaa;">관내 화장장 없음 (관외 요금 적용)</div>
  </div>
  <div style="font-size:10px;color:#bbb;padding:8px 4px;line-height:1.7;">
    ※ 일반 성인 시신 기준<br>
    ※ 자료: 전국 공설 화장시설 공개 사용료<br>
    ※ 시설별 감면·협약에 따라 다를 수 있음
  </div>`;
</script>
</body>
</html>
